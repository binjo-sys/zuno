name = "zuno-api"
main = "src/index.js"
compatibility_date = "2026-08-27"

[[d1_databases]]
binding = "DB"
database_name = "zuno-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zuno-media"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]
